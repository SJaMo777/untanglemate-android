# The trustStore override works around Norton's HTTPS interception:
# Norton installs its own root CA into Windows' certificate store (which
# curl/browsers trust automatically), but the JBR that Android
# Studio/Gradle uses ships its own separate cacerts file that doesn't
# have it, so every HTTPS dependency download fails PKIX validation.
# C:\Users\<you>\.android-dev-truststore\cacerts is a copy of the JBR's
# cacerts with Norton's CA (C:\ProgramData\Norton\Antivirus\wscert.pem)
# imported into it via keytool -importcert. See README-ANDROID.md.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore="C:/Users/sjmin/.android-dev-truststore/cacerts" -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
kotlin.code.style=official
